name: "Standard Build Step"
description: "shared build step used across my projects"
inputs:
  value:
    description: "build configuration value"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        STEP_VALUE: ${{ inputs.value }}
        STEP_GITHUB_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/build.sh"